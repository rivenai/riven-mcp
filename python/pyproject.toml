[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riven-mcp-server"
version = "1.0.0"
description = "MCP server exposing Riven AI platform capabilities (models, routing, billing) to AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Riven AI", email = "engineering@rivenai.io" },
]
keywords = ["mcp", "model-context-protocol", "riven", "ai", "llm", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.scripts]
riven-mcp = "riven_mcp.server:main"

[project.urls]
Homepage = "https://rivenai.io"
Repository = "https://github.com/rivenai/mcp-server"
Documentation = "https://docs.rivenai.io"
Issues = "https://github.com/rivenai/mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/riven_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
